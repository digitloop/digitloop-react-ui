# This is a basic workflow to help you get started with Actions

name: Build and Tag Release

# Controls when the workflow will run
on: workflow_dispatch
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
  #   branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

permissions:
  contents: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Check if tag already exists
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --tags origin | grep "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists. Aborting."
            exit 1
          fi
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build package
        run: npm run build

      - name: Get version from package.json
        id: get_version
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Commit dist to tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git checkout -b release-$VERSION
          git add -f dist
          git add LICENSE
          git add README.md
          git add package.json
          git commit -m "Release $VERSION"
          git tag $VERSION
          git push origin $VERSION
      
